  # -- Judicial opinions --------------------------------------------------
  - slug: supremecourt-opinions
    name: U.S. Supreme Court slip and bound opinions
    publisher: Supreme Court of the United States
    source_type: court_opinion
    base_url: https://www.supremecourt.gov/opinions/opinions.aspx
    retrieval_method: http_pdf
    official_source: true
    copyright_status: government_edict
    commercial_reuse_status: permitted
    license_notes: >-
      Judicial opinions are edicts of government and uncopyrightable
      (Banks v. Manchester; Georgia v. Public.Resource.Org, 590 U.S. 255 (2020)).
      This covers the opinion text only, not any commercial publisher's syllabus,
      headnotes, or star pagination apparatus.
    crawl_frequency: weekly
    crawl_status: urls_unverified
    url_verified: false
    notes: >-
      Controlling IDEA precedent, e.g. Rowley, Honig, Burlington, Carter, Forest
      Grove, Fry, Endrew F., Perez. Cite-check every case before use; case names
      and reporter cites in this repository are unverified.

  - slug: govinfo-uscourts
    name: GovInfo United States Courts Opinions (USCOURTS) collection
    publisher: U.S. Government Publishing Office
    source_type: court_opinion
    base_url: https://www.govinfo.gov/app/collection/uscourts
    retrieval_method: bulk_download
    official_source: true
    copyright_status: government_edict
    commercial_reuse_status: permitted
    crawl_frequency: weekly
    crawl_status: urls_unverified
    url_verified: false
    notes: >-
      Preferred federal appellate and district source: participating courts submit
      opinions to GPO, coverage is authenticated, and bulk access avoids PACER
      fees and terms. Coverage is incomplete by court and year - record gaps
      rather than assuming absence means no decision.
    meta:
      requires_api_key: "true"
      api_base_url: https://api.govinfo.gov

  - slug: caselaw-access-project
    name: Caselaw Access Project bulk opinions
    publisher: Harvard Law School Library Innovation Lab
    source_type: court_opinion
    base_url: https://static.case.law/
    retrieval_method: bulk_download
    official_source: false
    copyright_status: government_edict
    commercial_reuse_status: requires_legal_review
    license_notes: >-
      CAP released its scanned corpus for unrestricted use, and the underlying
      opinions are uncopyrightable edicts. NOT an official source, so it is
      secondary to GovInfo: use it for historical backfill and corroboration, and
      confirm current terms before commercial redistribution.
    crawl_frequency: annually
    crawl_status: urls_unverified
    url_verified: false
    notes: >-
      Non-.gov host; explicitly allowlisted in app/ingestion/url_safety.py.
      Historical backfill only.
