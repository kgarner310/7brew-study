name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  quality:
    name: Lint, format, typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Ruff format check
        run: ruff format --check .

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: mypy (strict)
        run: mypy app tests scripts

  test:
    name: Tests (PostgreSQL 16)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: idea_atlas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      IDEA_ATLAS_ENV: test
      IDEA_ATLAS_LOG_LEVEL: WARNING
      IDEA_ATLAS_AI_PROVIDER: "null"
      IDEA_ATLAS_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/idea_atlas
      IDEA_ATLAS_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/idea_atlas_test

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Create test database
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE idea_atlas_test;'

      - name: Verify migrations round-trip
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Run tests
        run: pytest -q --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  offline-ingestion:
    name: Offline ingestion smoke test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: idea_atlas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      IDEA_ATLAS_ENV: development
      IDEA_ATLAS_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/idea_atlas

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      # The documented quickstart must keep working. This is the guard against
      # README rot.
      - name: Migrate, seed, ingest fixtures, seed propositions
        run: |
          idea-atlas db upgrade head
          idea-atlas seed --reference-only
          idea-atlas ingest-source ecfr-34-cfr-300 --fixtures
          idea-atlas seed

      - name: Audit source verification status
        run: idea-atlas verify-sources

      - name: Print coverage table
        run: idea-atlas show-coverage

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose config --quiet

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: idea-atlas:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
